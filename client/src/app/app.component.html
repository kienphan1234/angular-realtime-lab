<div class="body">
  <h2>Client Chat</h2>
  <div class="chat-wrapper">

    <div class="status-bar" [class.live]="isConnected">
      {{ isConnected ? '● Đã kết nối Server' : '○ Đang ngoại tuyến' }}
    </div>

    <div class="message-area">
      <div *ngFor="let m of messages" class="bubble">{{ m }}</div>
    </div>

    <div class="input-box">
      <input #box (keyup.enter)="send(box.value); box.value=''" placeholder="Nhập nội dung...">
      <button (click)="send(box.value); box.value=''">Gửi</button>
    </div>
  </div>
</div>
